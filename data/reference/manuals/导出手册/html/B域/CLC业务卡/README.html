<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CLC业务卡 故障处理指引索引</title>
  <style>
    :root {
      --paper: #f7f3eb;
      --card: #fffdfa;
      --ink: #1f2a37;
      --muted: #5b6472;
      --line: #d7ccb6;
      --accent: #7b4b2a;
      --accent-soft: #efe4d5;
      --code-bg: #17212b;
      --code-ink: #f4f7fb;
      --shadow: 0 18px 45px rgba(76, 52, 32, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(123, 75, 42, 0.14), transparent 24%),
        linear-gradient(180deg, #fcf8f1 0%, #f4eee3 100%);
    }
    .page {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }
    .hero {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 18px;
      padding: 24px;
      border: 1px solid rgba(123, 75, 42, 0.16);
      border-radius: 24px;
      background: rgba(255, 253, 250, 0.92);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }
    .hero h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.25;
    }
    .hero p {
      margin: 10px 0 0;
      color: var(--muted);
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-start;
    }
    .actions a {
      text-decoration: none;
      color: var(--ink);
      background: var(--accent-soft);
      border: 1px solid rgba(123, 75, 42, 0.14);
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
    }
    .layout {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }
    .toc {
      position: sticky;
      top: 20px;
      padding: 18px;
      border-radius: 22px;
      border: 1px solid rgba(123, 75, 42, 0.12);
      background: rgba(255, 253, 250, 0.9);
      box-shadow: var(--shadow);
    }
    .toc h2 {
      margin: 0 0 12px;
      font-size: 17px;
    }
    .nav-link {
      display: block;
      color: var(--muted);
      text-decoration: none;
      padding: 7px 0;
      font-size: 14px;
      border-bottom: 1px dashed rgba(123, 75, 42, 0.09);
    }
    .nav-level-3 { padding-left: 12px; }
    .nav-level-4 { padding-left: 24px; }
    .article {
      padding: 26px 30px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid rgba(123, 75, 42, 0.12);
      box-shadow: var(--shadow);
    }
    .meta-card {
      margin: 0 0 20px;
      padding: 16px 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, #fdf8ef 0%, #f7efe3 100%);
      border-left: 5px solid var(--accent);
      color: var(--muted);
    }
    .meta-card p { margin: 6px 0; }
    h1, h2, h3, h4 {
      color: #2f2218;
      scroll-margin-top: 18px;
    }
    h2 {
      margin-top: 28px;
      padding-bottom: 8px;
      border-bottom: 2px solid rgba(123, 75, 42, 0.14);
      font-size: 24px;
    }
    h3 {
      margin-top: 22px;
      font-size: 18px;
    }
    p, li {
      font-size: 15px;
      line-height: 1.8;
    }
    code {
      padding: 2px 6px;
      border-radius: 8px;
      background: rgba(24, 39, 75, 0.08);
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.95em;
    }
    .code-block {
      overflow: hidden;
      border-radius: 18px;
      background: var(--code-bg);
      color: var(--code-ink);
      margin: 18px 0;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
    }
    .code-lang {
      padding: 10px 14px;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(244, 247, 251, 0.85);
    }
    pre {
      margin: 0;
      padding: 16px 18px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.65;
      font-family: Consolas, "Courier New", monospace;
    }
    .manual-figure {
      margin: 20px 0 24px;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid rgba(123, 75, 42, 0.14);
      background: #fffaf2;
    }
    .manual-figure img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }
    .manual-figure figcaption {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .missing-image {
      color: #9f1239;
      font-weight: 700;
    }
    .doc-table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0;
      overflow: hidden;
      border-radius: 18px;
    }
    .doc-table th,
    .doc-table td {
      border: 1px solid rgba(123, 75, 42, 0.16);
      padding: 10px 12px;
      vertical-align: top;
      font-size: 14px;
      line-height: 1.6;
    }
    .doc-table th {
      background: #f1e5d3;
      text-align: left;
    }
    hr {
      border: none;
      border-top: 1px solid rgba(123, 75, 42, 0.16);
      margin: 24px 0;
    }
    @media (max-width: 920px) {
      .layout { grid-template-columns: 1fr; }
      .toc { position: static; }
      .article { padding: 22px 18px; }
      .hero h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="page">

        <a href="../../../../处理手册/B域/CLC业务卡/README.md">打开 Markdown</a>
      </div>
    </section>
    <section class="layout">

      </article>
    </section>
  </main>
</body>
</html>
